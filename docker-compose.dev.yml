---
services:
  # --- Infrastructure Services ---

  postgres:
    image: postgres:15-alpine
    container_name: video-analysis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_processing}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-video_processing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-analysis-net

  redis:
    image: redis:7-alpine
    container_name: video-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - video-analysis-net

  minio:
    image: minio/minio:latest
    container_name: video-analysis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
      - shared_storage:/shared # Shared volume for processing files
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-analysis-net

  # --- Application Services ---

  base:
    build:
      context: .
      dockerfile: backend/base/Dockerfile
    image: video-processing/base:latest
    # This service only builds the base image and does not need to run.
    # We keep it here so other services can depend on it.

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: video-analysis-orchestrator
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/orchestrator:/home/app/orchestrator
      - shared_storage:/shared
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      base:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - video-analysis-net

  subtitle_processor:
    build:
      context: ./backend/subtitle_processor
      dockerfile: Dockerfile
    container_name: video-analysis-subtitle-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q subtitle_tasks
    volumes:
      - ./backend/subtitle_processor:/home/app/subtitle_processor
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - base
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  video_processor:
    build:
      context: ./backend/video_processor
      dockerfile: Dockerfile
    container_name: video-analysis-video-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q video_tasks
    volumes:
      - ./backend/video_processor:/home/app/video_processor
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - base
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  vision_analyzer:
    build:
      context: ./backend/vision_analyzer
      dockerfile: Dockerfile
    container_name: video-analysis-vision-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q vision_tasks
    volumes:
      - ./backend/vision_analyzer:/home/app/vision_analyzer
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - base
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  documentation_service:
    build:
      context: ./backend/documentation
      dockerfile: Dockerfile
    container_name: video-analysis-doc-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q doc_tasks
    volumes:
      - ./backend/documentation:/home/app/documentation
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - base
      - redis
      - orchestrator
    networks:
      - video-analysis-net

# --- Volumes and Networks ---

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  shared_storage:
    driver: local

networks:
  video-analysis-net:
    driver: bridge
