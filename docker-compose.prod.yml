---
services:
  # --- Reverse Proxy ---

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: video-analysis-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - orchestrator
    networks:
      - video-analysis-net

  # --- Frontend Service ---

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: video-analysis-frontend
    networks:
      - video-analysis-net

  # --- Infrastructure Services ---

  postgres:
    image: postgres:15-alpine
    container_name: video-analysis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_processing}
      POSTGRES_USER: ${POSTGRES_USER:-prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prod_user} -d ${POSTGRES_DB:-video_processing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-analysis-net

  redis:
    image: redis:7-alpine
    container_name: video-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - video-analysis-net

  minio:
    image: minio/minio:latest
    container_name: video-analysis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
      - shared_storage:/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-analysis-net

  # --- Application Services ---

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: video-analysis-orchestrator
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - video-analysis-net

  subtitle_processor:
    build:
      context: ./backend/subtitle_processor
      dockerfile: Dockerfile
    container_name: video-analysis-subtitle-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q subtitle_tasks
    volumes:
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  video_processor:
    build:
      context: ./backend/video_processor
      dockerfile: Dockerfile
    container_name: video-analysis-video-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q video_tasks
    volumes:
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  vision_analyzer:
    build:
      context: ./backend/vision_analyzer
      dockerfile: Dockerfile
    container_name: video-analysis-vision-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q vision_tasks
    volumes:
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - orchestrator
    networks:
      - video-analysis-net

  documentation_service:
    build:
      context: ./backend/documentation
      dockerfile: Dockerfile
    container_name: video-analysis-doc-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q doc_tasks
    volumes:
      - shared_storage:/shared
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - orchestrator
    networks:
      - video-analysis-net

# --- Volumes and Networks ---

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  shared_storage:
    driver: local

networks:
  video-analysis-net:
    driver: bridge
