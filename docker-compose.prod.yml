---
services:
  # --- Reverse Proxy ---

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: video-analysis-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    networks:
      - video-analysis-net

  # --- Frontend Service ---

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: video-analysis-frontend
    networks:
      - video-analysis-net

  # --- Infrastructure Services ---

  postgres:
    image: ankane/pgvector
    container_name: video-analysis-postgres
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=videorag
      - POSTGRES_PASSWORD=videorag
      - POSTGRES_DB=video_processing
    ports:
      - "5432:5432"
    volumes:
      - postgresql_local_data:/data
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videorag -d video_processing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-analysis-net

  redis:
    image: redis/redis-stack:latest
    container_name: video-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
      - "8081:8081"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - video-analysis-net

  minio:
    image: minio/minio:latest
    container_name: video-analysis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
      - shared_storage:/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-analysis-net

  # --- Application Services ---

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - video-analysis-backend:latest
    image: video-analysis-backend:latest
    container_name: video-analysis-api
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000
    volumes:
      - shared_storage:/shared
      - ./data/output:/app/output
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - video-analysis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - video-analysis-backend:latest
    image: video-analysis-backend:latest
    container_name: video-analysis-worker
    command: celery -A orchestrator.tasks.celery_app worker --loglevel=info -Q high_priority,default
    volumes:
      - shared_storage:/shared
      - ./data/output:/app/output
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - api
    networks:
      - video-analysis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "orchestrator.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# --- Volumes and Networks ---

volumes:
  postgresql_data:
    driver: local
  postgresql_local_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  shared_storage:
    driver: local

networks:
  video-analysis-net:
    driver: bridge
